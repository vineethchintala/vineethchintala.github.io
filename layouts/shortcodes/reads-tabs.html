<div class="reads-tabs-container">
    <div class="reads-tabs">
        <button class="reads-tab active" data-target="fiction">FICTION</button>
        <span class="reads-tab-divider">/</span>
        <button class="reads-tab" data-target="nonfiction">NON-FICTION</button>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const tabs = document.querySelectorAll('.reads-tab');
    const sections = document.querySelectorAll('.reading-grid');

    function applyFilter(target) {
        sections.forEach(sec => {
            const category = sec.querySelector('.sticky-category');
            if (category) {
                const catText = category.textContent.trim().toLowerCase();
                if (target === 'fiction') {
                    if (catText.includes('fiction') && !catText.includes('non')) {
                        sec.style.display = 'grid';
                    } else {
                        sec.style.display = 'none';
                    }
                } else if (target === 'nonfiction') {
                    if (catText.includes('non')) {
                        sec.style.display = 'grid';
                    } else {
                        sec.style.display = 'none';
                    }
                }
            }
        });
    }

    // Apply initial filter
    applyFilter('fiction');

    tabs.forEach(tab => {
        tab.addEventListener('click', function() {
            tabs.forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            const target = this.getAttribute('data-target');
            applyFilter(target);
        });
    });
});
</script>
