<div class="reads-tabs-container">
    <div class="reads-tabs">
        <button class="reads-tab active" data-target="fiction">FICTION</button>
        <span class="reads-tab-divider">/</span>
        <button class="reads-tab" data-target="nonfiction">NON-FICTION</button>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const tabs = document.querySelectorAll('.reads-tab');
    
    // Find H3 tags for Fiction and Nonfiction
    const h3s = Array.from(document.querySelectorAll('.container h3'));
    let fictionSection = null;
    let nonfictionSection = null;

    h3s.forEach(h3 => {
        const text = h3.textContent.trim().toLowerCase();
        const isFiction = text.includes('fiction') && !text.includes('non');
        const isNonFiction = text.includes('non');

        if (isFiction || isNonFiction) {
            // Create reads-section grid wrapper
            const section = document.createElement('div');
            section.className = 'reads-section';
            section.id = isFiction ? 'fiction-section' : 'nonfiction-section';
            
            if (isFiction) {
                section.classList.add('active');
                fictionSection = section;
            } else {
                nonfictionSection = section;
            }

            // Create sidebar
            const sidebar = document.createElement('div');
            sidebar.className = 'reading-sidebar';
            const span = document.createElement('span');
            span.className = 'sticky-category';
            span.textContent = isFiction ? 'Fiction' : 'Nonfiction';
            sidebar.appendChild(span);
            section.appendChild(sidebar);

            // Create content column
            const content = document.createElement('div');
            content.className = 'reading-content';
            section.appendChild(content);

            // Collect all sibling elements up to the next category header or script
            let sibling = h3.nextElementSibling;
            const toMove = [];
            while (sibling && sibling.tagName !== 'H3' && sibling.tagName !== 'SCRIPT' && !sibling.classList.contains('reads-tabs-container')) {
                toMove.push(sibling);
                sibling = sibling.nextElementSibling;
            }

            // Move elements into content column
            toMove.forEach(el => content.appendChild(el));

            // Replace H3 header with the beautifully typeset section grid
            h3.parentNode.insertBefore(section, h3);
            h3.parentNode.removeChild(h3);
        }
    });

    function applyFilter(target) {
        if (fictionSection) {
            fictionSection.classList.toggle('active', target === 'fiction');
        }
        if (nonfictionSection) {
            nonfictionSection.classList.toggle('active', target === 'nonfiction');
        }
    }

    // Force initial category visibility
    applyFilter('fiction');

    tabs.forEach(tab => {
        tab.addEventListener('click', function() {
            tabs.forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            const target = this.getAttribute('data-target');
            applyFilter(target);
        });
    });
});
</script>
