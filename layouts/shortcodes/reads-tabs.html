<div class="reads-page-grid">
    <div class="reads-sidebar">
        <div class="reads-menu">
            <!-- Menu items will be injected here dynamically -->
        </div>
    </div>
    <div class="reads-content-column">
        <!-- Content sections will be moved here dynamically -->
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const pageGrid = document.querySelector('.reads-page-grid');
    const menuContainer = pageGrid.querySelector('.reads-menu');
    const contentColumn = pageGrid.querySelector('.reads-content-column');

    // Find all H3 headers in the container that are siblings of pageGrid
    const container = pageGrid.parentNode;
    const h3s = Array.from(container.querySelectorAll('h3'));
    
    const sections = [];

    h3s.forEach((h3, index) => {
        const text = h3.textContent.trim();
        const id = text.toLowerCase().replace(/[^a-z0-9]/g, '-');

        // Create the content section for this category
        const section = document.createElement('div');
        section.className = 'reads-section';
        section.id = id + '-section';
        
        const readingContent = document.createElement('div');
        readingContent.className = 'reading-content';
        section.appendChild(readingContent);
        
        if (index === 0) {
            section.classList.add('active');
        }

        // Move all sibling elements until the next H3 or SCRIPT or end
        let sibling = h3.nextElementSibling;
        const toMove = [];
        while (sibling && sibling.tagName !== 'H3' && sibling.tagName !== 'SCRIPT' && sibling !== pageGrid) {
            toMove.push(sibling);
            sibling = sibling.nextElementSibling;
        }

        // Append elements to the readingContent block inside the section
        toMove.forEach(el => readingContent.appendChild(el));
        
        // Append section to the content column
        contentColumn.appendChild(section);
        sections.push(section);

        // Create the menu button in the sidebar
        const button = document.createElement('button');
        button.className = 'reads-menu-item';
        if (index === 0) {
            button.classList.add('active');
        }
        button.textContent = text.toUpperCase();
        button.setAttribute('data-target', id);
        
        button.addEventListener('click', function() {
            // Remove active classes
            menuContainer.querySelectorAll('.reads-menu-item').forEach(btn => btn.classList.remove('active'));
            sections.forEach(sec => sec.classList.remove('active'));

            // Set active
            this.classList.add('active');
            section.classList.add('active');
        });

        menuContainer.appendChild(button);

        // Remove the original H3
        h3.parentNode.removeChild(h3);
    });
});
</script>
